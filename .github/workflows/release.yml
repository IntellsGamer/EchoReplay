name: Publish EchoReplay Release Jars

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Space-separated Minecraft versions to publish (e.g. 1.21.5 1.21.11)'
        required: false
        default: '1.21.5 1.21.11'
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build shade jars
        run: mvn -q -DskipTests clean package

      - name: Publish / update releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NYX_VERSION=$(grep -oPm1 '(?<=<version>)[0-9]+\.[0-9]+\.[0-9]+' pom.xml)
          echo "Plugin version: $NYX_VERSION"

          read -r -a vers <<< "${{ inputs.versions }}"
          mapfile -t vers < <(printf '%s\n' "${vers[@]}" | sort -t. -k1,1n -k2,2n -k3,3n)
          last=$(( ${#vers[@]} - 1 ))
          i=0
          for v in "${vers[@]}"; do
            jar="$GITHUB_WORKSPACE/$v/target/echoreplay-$v+1.0.0.jar"
            if [ "$v" = "1.21.5" ]; then
              jar="$GITHUB_WORKSPACE/$v/target/echoreplay-1.21.5+1.0.0-SNAPSHOT.jar"
            fi

            if [ ! -f "$jar" ]; then
              echo "::error::Missing built jar: $jar (is $v a valid module?)"
              exit 1
            fi

            if [ "$i" -eq "$last" ]; then
              latest_flag="--latest"
            else
              latest_flag="--latest=false"
            fi
            i=$((i + 1))

            if gh release view "$v" >/dev/null 2>&1; then
              echo "Release $v exists -> updating assets with --clobber"
              gh release upload "$v" "$jar" --clobber
              gh release edit "$v" "$latest_flag" --draft=false
            else
              echo "Creating release $v"
              gh release create "$v" "$latest_flag" \
                --title "EchoReplay $v" \
                --notes "EchoReplay $v — Server-side region replay plugin for Paper $v." \
                "$jar"
            fi
          done
