# EchoReplay configuration v2 — every key below is read by the plugin.
# See /er stats in-game for resolved values, and the startup log for any
# unknown keys you might have carried over from v1.
config-version: 2

selection:
  # Honored at /er wand (S-1/D-2 fix). PDC tag wins, so an existing wand
  # still works even if you change this. Valid values are Material enum names.
  wand-material: GOLDEN_AXE
  # Block count limit. Bypass with the echoreplay.bypass-limits permission.
  max-volume: 300000
  # Horizontal span limit (x or z). Bypass with echoreplay.bypass-limits.
  max-horizontal-span: 256
  # Reserved for a future selection wireframe renderer (currently unused).
  outline-particles: true

recording:
  # Reserved for the streaming-journal feature (planned P-1). v1's flush
  # was a no-op; this key is read but currently defers to stop-time write.
  flush-seconds: 15
  # Maximum recording length. 0 = unlimited. Hit this -> auto-stop and save.
  max-duration-minutes: 30
  # Capture chat events. Disable to suppress chat recording entirely.
  capture-chat: true
  # Reserved for the WorldTime recorder (planned F-2). Read but currently
  # has no effect — no recorder is wired.
  capture-time: true
  # Reserved for the Weather recorder (planned F-2). Read but currently
  # has no effect — no recorder is wired.
  capture-weather: true
  # Whether to capture particle events. Default true.
  capture-particles: true
  # Reserved for a future per-second particle budget. Read but not enforced yet.
  max-particles-per-second: 400
  # Background RegionDiff scan budget per pass, in milliseconds. Lower = less
  # main-thread pressure, slower coverage; higher = faster coverage, more CPU.
  # (Was a hidden key in v1 — now documented.)
  scan-ms-per-pass: 12
  # Legacy key, ignored — scanning is full-time with a budget per pass.
  scan-interval-ticks: 1
  # Tile-entity NBT capture is on for every TileState (D-5). No config needed.

replay:
  # If true, /er play defaults to virtual mode (no world edits). If false,
  # /er play defaults to world mode (writes recorded snapshot to live terrain).
  # World mode is destructive — see S-3 / D-7 for the race + seek guards.
  virtual-packets-only: false
  # Reserved for the force-spectator feature (planned U-5). Read but not yet
  # enforced — viewers are not put in spectator mode currently.
  force-spectator: true
  # Players within this many blocks of the cuboid are auto-added as viewers.
  # Set to 0 to disable auto-watch.
  auto-watch-radius: 32
  # Reserved for the world-time drive feature (planned F-2). Read but no-op.
  drive-world-time: false
  # Cancel BlockPhysicsEvent inside the cuboid while a world-mode replay runs.
  # Keeps flowing water / falling sand / piston cascades out of the snapshot.
  physics-frozen: true
  # Skip sound + particle emission when playback speed exceeds this value.
  # Set to 0 to never skip (let catch-up bursts flood — not recommended).
  skip-sfx-when-speed-above: 2.0
  # Default playback speed at /er play.
  default-speed: 1.0
  # Hard speed bounds (S-7). /er speed clamps to this range; NaN/-inf rejected.
  min-speed: 0.125
  max-speed: 16.0
  # Per-tick time budget for streaming phases (CAPTURE/SNAPSHOT/RESTORE/CATCHUP)
  # in milliseconds. Lower = less main-thread pressure, slower phases.
  # (Was a hidden key replay.phase-max-ms-per-tick in v1 — now documented
  # and the alias still works for back-compat.)
  phase-budget-ms-per-tick: 8
  snapshot:
    # Maximum blocks applied per tick during the snapshot apply/restore phases.
    # Default 8000 covers a 20×20×20 region in roughly one tick.
    blocks-per-tick: 8000
  border:
    enabled: true
    particle: END_ROD
    interval-ticks: 4
    step: 2.0
    max-per-frame: 300

storage:
  # Subdirectory of plugins/EchoReplay/ where .echoreplay.gz files live.
  directory: recordings
  # Reserved for the streaming journal crash-recovery feature (planned P-1).
  # Read but not yet enforced — partial recordings are deleted on startup.
  keep-partial-on-crash: true
  # Compression algorithm. Currently only "gzip" is supported; "zstd" is
  # reserved for a future format v2 (P-7).
  compression: gzip
  # Maximum total size of the recordings directory, in GB. 0 = no quota.
  # Reserved for a future auto-prune-oldest feature. Read but not enforced.
  max-size-gb: 0
